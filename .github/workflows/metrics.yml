name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Main metrics
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, repositories, community, metadata
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage

      # 2. Daily activity graph
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: DadiSoumia
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: github-metrics-habits.svg
          options: bg_color=F3E8FF&border_color=D8B4FE&color=6B21A8&title_color=7E22CE&line=9333EA&point=A855F7&area_color=C084FC&area=true&hide_border=false&days=30

      # 3. Commit generated SVG files
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
          git add github-metrics.svg
          git add github-metrics-habits.svg
      
          git commit -m "Update GitHub metrics" || exit 0
      
          git pull --rebase origin main
          git push
